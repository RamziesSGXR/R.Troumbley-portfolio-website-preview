    --ink:#221c14;

    --folder-tan:#c9a06a;
    --folder-tan-dark:#a67c46;

    --brass:#a8823c;

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;

      radial-gradient(ellipse at 50% 15%, rgba(255,224,160,0.10), transparent 55%),

    padding:8%;

    transform-origin: 50% 100%;
    transform-style:preserve-3d;
  }
  .folder-closed::before{
    content:"";
    position:absolute; top:-14px; left:8%;

  }
  .folder-closed.opening{
    transform: rotateX(-125deg) translateY(-10px);
    opacity:0;
    pointer-events:none;
  }
  .stamp{
    font-family:'Special Elite', monospace;
    color:var(--stamp-red);
    border:3px solid var(--stamp-red);
    border-radius:6px;

    transform:rotate(-8deg);

    font-size:clamp(14px,2.6vw,20px);

/* ---------------- audio: synthesized typewriter sounds ---------------- */
let actx;
function getCtx(){
  if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  return actx;
}
function noiseBurst(duration, freq, q, gainVal){
  const ctx = getCtx();
  const size = Math.floor(ctx.sampleRate * duration);
  const buffer = ctx.createBuffer(1, size, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<size;i++){
    data[i] = (Math.random()*2-1) * Math.pow(1 - i/size, 2);
  }
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const filt = ctx.createBiquadFilter();
  filt.type = 'bandpass';
  filt.frequency.value = freq;
  filt.Q.value = q;
  const gain = ctx.createGain();
  gain.gain.value = gainVal;
  src.connect(filt).connect(gain).connect(ctx.destination);
  src.start();
}
function clack(){ noiseBurst(0.035, 2200 + Math.random()*400, 2.5, 0.28); }
function thunk(){
  noiseBurst(0.18, 180, 1.2, 0.5);
  setTimeout(()=>noiseBurst(0.08, 3000, 1.5, 0.15), 40);
}

/* ---------------- typewriter reveal ---------------- */
function typeInto(el, text, speed=22){
  el.innerHTML = '';
  let i = 0;
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  cursor.textContent = '\u00A0';
  el.appendChild(cursor);
  const interval = setInterval(()=>{
    if(i < text.length){
      cursor.insertAdjacentText('beforebegin', text[i]);
      if(text[i] !== ' ' && i % 3 === 0) clack();
      i++;
    } else {
      clearInterval(interval);
      cursor.remove();
    }
  }, speed);
}

/* ---------------- render tabs ---------------- */
function renderTab(name){
  if(name === 'file') return renderFile();

  if(name === 'projects') return renderProjects();
  if(name === 'contact') return renderContact();
}

function remount(html){

  page.style.animation = 'flipIn 0.4s ease';
}
